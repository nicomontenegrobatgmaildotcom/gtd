<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GTD">
<title>GTD</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#eee);--mute:light-dark(#666,#999);--line:light-dark(#ddd,#2a2a2a);--acc:#e4002b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:28px;margin:0 0 16px}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:0 12px}
button{cursor:pointer}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 220px}
.err{color:var(--acc);font-size:14px;min-height:20px;margin:4px 0}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin:8px 0 12px}
nav button{border:0;border-radius:6px 6px 0 0}
nav button.on{background:var(--ink);color:var(--bg)}
.n{font-size:13px;opacity:.7;margin-left:4px}
.item{border-bottom:1px solid var(--line);padding:10px 0}
.t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:13px;color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button,.acts select,.acts input{min-height:36px;font-size:14px;padding:0 8px}
.done .txt{text-decoration:line-through;color:var(--mute)}
.empty{color:var(--mute);padding:20px 0}
.review label{display:block;padding:8px 0;border-bottom:1px solid var(--line)}
.review input{min-height:auto;margin-right:8px}
a{color:inherit}
small{color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Getting things done</h1>

<div id="login" hidden>
  <p>Sign in with your email. You'll get a login link.</p>
  <div class="row"><input id="email" type="email" placeholder="you@gmail.com"><button class="pri" id="send">Send link</button></div>
  <div class="err" id="lerr"></div>
</div>

<div id="app" hidden>
  <div class="row">
    <input id="cap" placeholder="Call dentist about appointment" aria-label="Capture">
    <button class="pri" id="add">Capture</button>
  </div>
  <div class="err" id="err"></div>
  <nav id="tabs"></nav>
  <div id="view"></div>
  <p><small><button id="out">Sign out</button></small></p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
{
// ---- Fill these in (Supabase > Project Settings > API) ----
const SUPABASE_URL='https://ltdicssbcrgcgbdawifb.supabase.co';
const SUPABASE_KEY='sb_publishable_n3ZM0RofW432vvMmo518WQ_JEY5y7fn';
// -----------------------------------------------------------

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LISTS={inbox:'Inbox',next:'Next actions',waiting:'Waiting for',someday:'Someday',projects:'Projects',done:'Done',review:'Weekly review'};
const CTX=['','@home','@work','@phone','@computer','@errands'];
const REVIEW=['Empty the inbox','Check every project has a next action','Go through waiting for','Look at the calendar for next 2 weeks','Skim someday / maybe','Clear done items'];
let items=[],rev=[],tab=localStorage.getItem('tab')||'inbox',ctx='';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const projects=()=>items.filter(i=>i.list==='projects').map(i=>i.title);

async function load(){
  const {data,error}=await db.from('items').select('*').order('created_at',{ascending:false});
  if(error){$('err').textContent=error.message;return}
  items=data;
  const r=await db.from('reviews').select('checked').maybeSingle();
  rev=r.data?.checked||[];
  render();
}

async function upd(id,patch){
  const {error}=await db.from('items').update(patch).eq('id',id);
  if(error)$('err').textContent=error.message;
  await load();
}

async function add(text){
  const v=(text??$('cap').value).trim();
  if(!v){$('err').textContent='Type something first';return}
  const {error}=await db.from('items').insert({title:v});
  if(error){$('err').textContent=error.message;return}
  $('cap').value='';load();
}

function itemHTML(i){
  const mv=(l,lab)=>i.list!==l?`<button data-a="mv" data-l="${l}" data-id="${i.id}">${lab}</button>`:'';
  const del=`<button data-a="del" data-id="${i.id}">Delete</button>`;
  let a;
  if(i.list==='projects'){
    const n=items.filter(x=>x.project===i.title&&x.list==='next').length;
    a=`<span class="tag">${n?n+' next action'+(n>1?'s':''):'No next action'}</span><button data-a="sub" data-id="${i.id}">Add next action</button>${del}`;
  }else if(i.list==='done'){
    a=mv('next','Undo')+del;
  }else{
    a=mv('next','Next action')+mv('waiting','Waiting for')+mv('someday','Someday')+mv('projects','Make project')+
    `<button data-a="mv" data-l="done" data-id="${i.id}">Done</button>
    <select data-a="context" data-id="${i.id}" aria-label="Context">${CTX.map(c=>`<option ${c===i.context?'selected':''} value="${c}">${c||'No context'}</option>`).join('')}</select>
    <select data-a="project" data-id="${i.id}" aria-label="Project"><option value="">No project</option>${projects().map(p=>`<option ${p===i.project?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <input type="date" data-a="due" data-id="${i.id}" value="${i.due||''}" aria-label="Due date">${del}`;
  }
  const link=(i.notes||'').match(/https?:\/\/\S+/);
  return `<div class="item ${i.list==='done'?'done':''}"><div class="t">
  <span class="txt" contenteditable="true" data-id="${i.id}">${esc(i.title)}</span>
  ${i.context?`<span class="tag">${i.context}</span>`:''}
  ${i.project&&i.list!=='projects'?`<span class="tag">[${esc(i.project)}]</span>`:''}
  ${i.due?`<span class="tag">due ${i.due}</span>`:''}
  ${i.source!=='app'?`<span class="tag">via ${esc(i.source)}</span>`:''}
  ${link?`<a class="tag" href="${esc(link[0])}" target="_blank">open</a>`:''}
  </div><div class="acts">${a}</div></div>`;
}

function render(){
  localStorage.setItem('tab',tab);
  $('tabs').innerHTML=Object.entries(LISTS).map(([k,v])=>
    `<button data-tab="${k}" class="${tab===k?'on':''}">${v}<span class="n">${k==='review'?'':items.filter(i=>i.list===k).length}</span></button>`).join('');
  let h='';
  if(tab==='review'){
    h='<div class="review">'+REVIEW.map((r,j)=>`<label><input type="checkbox" data-a="rev" data-j="${j}" ${rev.includes(j)?'checked':''}>${r}</label>`).join('')+
      '</div><p><button data-a="resetrev">Start new review</button></p>';
  }else{
    let list=items.filter(i=>i.list===tab);
    if(tab==='next'){
      h=`<p><select data-a="filter" aria-label="Filter">${CTX.map(c=>`<option ${c===ctx?'selected':''} value="${c}">${c||'All contexts'}</option>`).join('')}</select></p>`;
      if(ctx)list=list.filter(i=>i.context===ctx);
    }
    h+=list.length?list.map(itemHTML).join(''):`<div class="empty">${tab==='inbox'?'Inbox zero.':'Nothing here.'}</div>`;
  }
  $('view').innerHTML=h;
}

async function saveRev(){await db.from('reviews').upsert({checked:rev});render()}

$('add').onclick=()=>add();
$('cap').onkeydown=e=>{$('err').textContent='';if(e.key==='Enter')add()};
$('out').onclick=async()=>{await db.auth.signOut();location.reload()};
$('send').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email){$('lerr').textContent='Enter your email';return}
  const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  $('lerr').textContent=error?error.message:'Check your email for the link.';
};

document.body.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  const id=+b.dataset.id,it=items.find(i=>i.id===id);
  if(b.dataset.a==='mv')upd(id,{list:b.dataset.l});
  if(b.dataset.a==='del'){await db.from('items').delete().eq('id',id);load()}
  if(b.dataset.a==='sub'){await db.from('items').insert({title:'New action for '+it.title,list:'next',project:it.title});tab='next';ctx='';load()}
  if(b.dataset.a==='resetrev'){rev=[];saveRev()}
});
document.body.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.a,id=+el.dataset.id;
  if(a==='context'||a==='project')upd(id,{[a]:el.value});
  if(a==='due')upd(id,{due:el.value||null});
  if(a==='filter'){ctx=el.value;render()}
  if(a==='rev'){const j=+el.dataset.j;rev=el.checked?[...rev,j]:rev.filter(x=>x!==j);saveRev()}
});
document.body.addEventListener('focusout',async e=>{
  const el=e.target;if(!el.classList.contains('txt'))return;
  const it=items.find(i=>i.id===+el.dataset.id),v=el.textContent.trim();
  if(!it||!v||v===it.title){render();return}
  if(it.list==='projects')await db.from('items').update({project:v}).eq('project',it.title);
  upd(it.id,{title:v});
});
document.body.addEventListener('keydown',e=>{if(e.target.classList.contains('txt')&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('app').hidden)load()});

db.auth.onAuthStateChange((_e,session)=>{
  $('login').hidden=!!session;
  $('app').hidden=!session;
  if(session){
    // Support quick capture links: index.html?add=Call%20dentist
    const q=new URLSearchParams(location.search).get('add');
    setTimeout(()=>{if(q){history.replaceState(null,'',location.pathname);add(q)}else load()},0);
  }
});
}
</script>
</body>
</html>
